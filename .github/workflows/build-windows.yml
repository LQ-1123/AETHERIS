# 用 GitHub Actions 在 Windows 上构建"开箱即用"的 AETHERIS 安装包。
# 产出: AETHERIS-Setup-<tauri 版本>-x64.exe（内含 Viewer + pacsd + PostgreSQL + 启动器，目标机零依赖）。
# 触发: 手动（workflow_dispatch）或推送 v* 标签。
#
# 打包流程对应 packaging/windows/build.ps1：
#   编译 pacsd + aetheris-launcher → tauri 构建 AETHERIS.exe → 组装 postgres/bin|lib|share
#   + ai-plugins + libarchive DLL → Inno Setup 出安装包。
# 目标机安装时由 initialize.ps1 完成 initdb / 建库 / 建管理员，launcher 一键拉起全部服务。

name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # windows-latest 预装 vcpkg（compress-tools 的 vcpkg crate 认 VCPKG_ROOT）
      VCPKG_INSTALLATION_ROOT: C:\vcpkg
      VCPKG_ROOT: C:\vcpkg
      # 可在此升级 PostgreSQL 版本（EDB 官方 Windows x64 二进制包）
      PG_VERSION: 16.4
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/viewer/package-lock.json

      # vcpkg 编译产物缓存：libarchive 从源码编译约 10 分钟,缓存后秒级恢复
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      # compress-tools 的 vcpkg 查找用 x64-windows-static-md 三元组（静态链接，运行时无需 DLL）
      - name: Install libarchive via vcpkg (static)
        shell: bash
        run: vcpkg install libarchive:x64-windows-static-md

      # cargo 缓存：避免每次冷启动全量编译依赖（首轮 ~20min，之后 ~5min）
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Download PostgreSQL binaries
        shell: bash
        run: |
          PG_DIR="$RUNNER_TEMP/pg"
          mkdir -p "$PG_DIR"
          curl -fL --retry 3 -o "$PG_DIR/pg.zip" "https://get.enterprisedb.com/postgresql/postgresql-${{ env.PG_VERSION }}-1-windows-x64-binaries.zip"
          unzip -q "$PG_DIR/pg.zip" -d "$PG_DIR"
          ls "$PG_DIR/pgsql/bin/initdb.exe"
          echo "PG_DIR=$PG_DIR" >> "$GITHUB_ENV"

      - name: Install Inno Setup
        shell: bash
        run: choco install innosetup -y --no-progress

      - name: Read application version
        shell: bash
        run: |
          APP_VERSION="$(node -p "require('./apps/viewer/src-tauri/tauri.conf.json').version")"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build installer (pacsd + launcher + viewer + postgres + Inno Setup)
        shell: pwsh
        run: ./packaging/windows/build.ps1 -PostgresDir "$env:PG_DIR\pgsql"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AETHERIS-Setup-${{ env.APP_VERSION }}-x64
          path: packaging/windows/output/*.exe
          if-no-files-found: error
