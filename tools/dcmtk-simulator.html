<!doctype html><meta charset="utf-8"><title>DCMTK 设备模拟器</title>
<style>body{font:15px system-ui;max-width:980px;margin:32px auto;color:#17202a}section{border:1px solid #ccd5df;padding:18px;margin:14px 0;border-radius:8px}input,button{padding:8px;margin:4px}#drop{border:2px dashed #8aa0b5;padding:35px;text-align:center}pre{white-space:pre-wrap;background:#f5f7f9;padding:10px}</style>
<h1>DCMTK 设备模拟器</h1><p>拖拽 DICOM 文件夹到下方。每台设备并发执行 storescu C-STORE。</p>
<section><div id="drop">拖拽文件夹或文件到这里，或 <input id="pick" type="file" webkitdirectory multiple></div><p id="count">尚未选择文件</p></section>
<section><h3>设备配置（每行一台）</h3><div id="devices"></div><button onclick="addDevice()">添加设备</button></section>
<button onclick="send()">开始并发上传</button><pre id="log"></pre>
<script>
let files=[]; const $=id=>document.getElementById(id); function addDevice(){let i=document.querySelectorAll('.dev').length;let d=document.createElement('div');d.className='dev';d.innerHTML=`<input placeholder="设备名" value="设备 ${i+1}"><input placeholder="Calling AE" value="SIM_${i+1}"><input placeholder="Called AE" value="REMOTE_PACS"><input placeholder="主机" value="127.0.0.1"><input type="number" placeholder="端口" value="11112">`;d.dataset.i=i;$('devices').append(d)} addDevice();
function accept(list){files=[...list];$('count').textContent=`已选择 ${files.length} 个文件`};$('pick').onchange=e=>accept(e.target.files);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();accept(e.dataTransfer.files)};
async function send(){if(!files.length)return alert('请先选择文件');let rows=[...document.querySelectorAll('.dev')];let devices=rows.map((r,i)=>({name:r.children[0].value,calling_ae:r.children[1].value,called_ae:r.children[2].value,host:r.children[3].value,port:+r.children[4].value,files:files.filter((_,j)=>j%rows.length===i)})).filter(d=>d.files.length);$('log').textContent='正在上传...';let enc=await Promise.all(devices.map(async d=>({...d,files:await Promise.all(d.files.map(async f=>({name:f.webkitRelativePath||f.name,data:btoa(String.fromCharCode(...new Uint8Array(await f.arrayBuffer())))})))})));let r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({devices:enc})});let j=await r.json();let timer=setInterval(async()=>{let s=await (await fetch('/api/jobs/'+j.job_id)).json();$('log').textContent=JSON.stringify(s,null,2);if(['succeeded','failed'].includes(s.state))clearInterval(timer)},500)}
</script>
