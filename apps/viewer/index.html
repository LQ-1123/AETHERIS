<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PACS 查看器</title>
    <script type="module">
      // 等待 Tauri 就绪
      if (window.__TAURI_INTERNALS__) {
        console.log('Tauri internals loaded');
      } else {
        console.warn('Tauri internals not available');
      }
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1e1e1e;
        color: #e0e0e0;
        overflow: hidden;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      #toolbar {
        background: #2d2d2d;
        padding: 12px 16px;
        border-bottom: 1px solid #3d3d3d;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      button {
        background: #0e639c;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background: #1177bb;
      }

      button:active {
        background: #0d5a8f;
      }

      #info {
        flex: 1;
        font-size: 13px;
        color: #b0b0b0;
      }

      #viewport {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
      }

      #canvas {
        max-width: 100%;
        max-height: 100%;
        image-rendering: pixelated;
        cursor: crosshair;
      }

      #help {
        position: absolute;
        bottom: 16px;
        right: 16px;
        background: rgba(0, 0, 0, 0.7);
        padding: 12px;
        border-radius: 4px;
        font-size: 12px;
        line-height: 1.6;
      }

      #help div {
        margin-bottom: 4px;
      }

      #help div:last-child {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button id="open-btn">打开文件 (Ctrl+O)</button>
        <div id="info">未加载文件</div>
      </div>
      <div id="viewport">
        <canvas id="canvas"></canvas>
      </div>
      <div id="help">
        <div><strong>操作提示:</strong></div>
        <div>拖动 - 调整窗宽窗位</div>
        <div>滚轮 - 缩放</div>
        <div>Ctrl+O - 打开文件</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
