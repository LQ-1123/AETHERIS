<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote PACS Viewer</title>
  </head>
  <body>
    <section id="login-screen" aria-labelledby="login-title">
      <form id="login-form" class="login-panel">
        <div class="login-brand">
          <span class="brand-mark">RP</span>
          <div>
            <h1 id="login-title">REMOTE PACS</h1>
            <span>安全登录</span>
          </div>
        </div>
        <label>
          <span>服务器</span>
          <input id="server-url" name="server" type="url" value="https://127.0.0.1:8443" required spellcheck="false" />
        </label>
        <label>
          <span>CA 证书</span>
          <span class="path-control">
            <input id="ca-cert-path" name="certificate" type="text" required spellcheck="false" />
            <button id="choose-ca-btn" class="icon-button" type="button" title="选择 CA 证书" aria-label="选择 CA 证书">
              <i data-lucide="folder-open"></i>
            </button>
          </span>
        </label>
        <label>
          <span>用户名</span>
          <input id="login-username" name="username" autocomplete="username" required />
        </label>
        <label>
          <span>密码</span>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" role="alert" hidden></p>
        <button id="login-btn" class="command-button login-submit" type="submit">
          <i data-lucide="log-in"></i>
          <span>登录</span>
        </button>
      </form>
    </section>

    <main id="app-shell">
      <header id="toolbar">
        <div class="brand" aria-label="Remote PACS Viewer">
          <span class="brand-mark">RP</span>
          <span class="brand-name">REMOTE PACS</span>
        </div>
        <div class="toolbar-divider"></div>
        <button id="worklist-toggle" class="icon-button" type="button" title="病人列表" aria-label="显示或隐藏病人列表">
          <i data-lucide="users"></i>
        </button>
        <button id="open-btn" class="command-button" type="button" title="打开 DICOM 文件">
          <i data-lucide="folder-open"></i>
          <span>打开序列</span>
        </button>
        <div class="segmented" role="group" aria-label="阅片工具">
          <button data-tool="window" data-requires-series type="button" title="窗宽窗位" aria-label="窗宽窗位">
            <i data-lucide="sliders-horizontal"></i>
          </button>
          <button data-tool="pan" data-requires-series type="button" title="平移" aria-label="平移">
            <i data-lucide="move"></i>
          </button>
          <button data-tool="length" data-requires-series type="button" title="测距" aria-label="测距">
            <i data-lucide="ruler"></i>
          </button>
        </div>
        <button id="reset-btn" class="icon-button" data-requires-series type="button" title="重置视图" aria-label="重置视图">
          <i data-lucide="rotate-ccw"></i>
        </button>
        <label class="preset-control">
          <span>窗预设</span>
          <select id="preset-select" data-requires-series aria-label="窗预设"></select>
        </label>
        <div class="readouts" aria-live="polite">
          <span id="window-readout">WL -- WW --</span>
          <span id="zoom-readout">100%</span>
        </div>
        <button id="panel-toggle" class="icon-button" type="button" title="检查信息" aria-label="显示或隐藏检查信息">
          <i data-lucide="panel-right-close"></i>
        </button>
        <span id="current-user" class="current-user"></span>
        <button id="logout-btn" class="icon-button" type="button" title="退出登录" aria-label="退出登录">
          <i data-lucide="log-out"></i>
        </button>
      </header>

      <div id="error-banner" class="status-banner" role="alert" hidden>
        <i data-lucide="info"></i>
        <span id="error-message"></span>
        <button id="error-close" type="button" aria-label="关闭消息" title="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>

      <section id="workspace">
        <aside id="worklist-panel" aria-label="病人列表">
          <div class="worklist-heading">
            <div>
              <h2>病人列表</h2>
              <span id="worklist-count">本页 0 位</span>
            </div>
            <button id="refresh-worklist" class="icon-button" type="button" title="刷新病人列表" aria-label="刷新病人列表">
              <i data-lucide="refresh-cw"></i>
            </button>
          </div>
          <form id="patient-search" class="search-control" role="search">
            <i data-lucide="search"></i>
            <input id="patient-query" type="search" placeholder="姓名或 Patient ID" aria-label="搜索病人" />
          </form>
          <div id="worklist-status" class="worklist-status" aria-live="polite"></div>
          <div id="patient-list" class="patient-list"></div>
          <div class="worklist-pagination">
            <button id="patients-previous" class="icon-button" type="button" title="上一页" aria-label="上一页">
              <i data-lucide="chevron-left"></i>
            </button>
            <span id="patient-page">第 1 页</span>
            <button id="patients-next" class="icon-button" type="button" title="下一页" aria-label="下一页">
              <i data-lucide="chevron-right"></i>
            </button>
          </div>
        </aside>

        <div id="viewport">
          <canvas id="image-canvas"></canvas>
          <canvas id="overlay-canvas"></canvas>
          <div id="empty-state">
            <div class="empty-symbol">DICOM</div>
            <h1>REMOTE PACS VIEWER</h1>
            <button id="empty-open-btn" type="button" class="command-button">
              <i data-lucide="folder-open"></i>
              <span>打开序列</span>
            </button>
          </div>
          <div id="loading" class="loading-state" hidden>
            <span class="spinner"></span>
            <span id="loading-text"></span>
            <button id="cancel-download" class="loading-cancel" type="button" hidden>取消</button>
          </div>
          <div class="viewport-overlay top-left" data-series-overlay aria-live="polite" hidden>
            <strong id="patient-name">未加载</strong>
            <span id="patient-id">--</span>
          </div>
          <div class="viewport-overlay top-right" data-series-overlay hidden>
            <span id="modality-overlay"></span>
          </div>
        </div>

        <aside id="details-panel" aria-label="检查信息">
          <div class="panel-heading">
            <h2>检查信息</h2>
            <span id="spacing-badge" data-confidence="none">仅像素</span>
          </div>
          <dl class="metadata-list">
            <div><dt>患者</dt><dd id="patient-name-detail">--</dd></div>
            <div><dt>患者 ID</dt><dd id="patient-id-detail">--</dd></div>
            <div><dt>检查日期</dt><dd id="study-date">--</dd></div>
            <div><dt>Accession</dt><dd id="accession-number">--</dd></div>
            <div><dt>模态</dt><dd id="modality">--</dd></div>
            <div><dt>检查描述</dt><dd id="study-description">--</dd></div>
            <div><dt>序列描述</dt><dd id="series-description">--</dd></div>
            <div><dt>图像</dt><dd id="dimensions">--</dd></div>
            <div><dt>实例号</dt><dd id="instance-number">--</dd></div>
          </dl>
          <div class="panel-section">
            <h3>测量标定</h3>
            <p id="spacing-description">未加载影像</p>
          </div>
          <div class="panel-footer" id="annotation-count">0 项标注</div>
        </aside>
      </section>

      <footer id="series-navigator">
        <button id="previous-frame" class="icon-button" data-requires-series type="button" title="上一帧" aria-label="上一帧">
          <i data-lucide="chevron-left"></i>
        </button>
        <input id="frame-slider" data-requires-series type="range" min="0" max="0" value="0" aria-label="当前帧" />
        <button id="next-frame" class="icon-button" data-requires-series type="button" title="下一帧" aria-label="下一帧">
          <i data-lucide="chevron-right"></i>
        </button>
        <span id="frame-counter">0 / 0</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
