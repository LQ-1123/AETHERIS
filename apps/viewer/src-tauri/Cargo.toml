# 查看器**自成 workspace**,不并入根 workspace。
#
# 理由是系统依赖:Tauri 在 Linux 需要 gtk 和 webkit2gtk。并入根 workspace 后,
# CI 上的 `cargo test --workspace` 会连查看器一起编译,于是服务端的 CI 也得
# 装这两个系统库 —— 而服务端(pacsd)根本用不到它们。
#
# 代价是两个 Cargo.lock,共享依赖有版本漂移的可能。所以下面对 pacs-core /
# pacs-codec 用到的那几个依赖显式写死同一版本号,与根 workspace 保持一致。
[workspace]

[package]
name = "pacs-viewer"
description = "AETHERIS Medical Imaging Cloud:Tauri 2 桌面客户端"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lints.rust]
unsafe_code = "forbid"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# 共享 crate。跨 workspace 的路径依赖 —— 同一份源码,不会有版本漂移。
pacs-core = { path = "../../../crates/pacs-core" }
pacs-codec = { path = "../../../crates/pacs-codec" }

tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.5.0"
# 与根 workspace 保持同版本,避免共享 crate 在两边解析出不同的依赖
dicom = "0.10"
dicom-json = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
rayon = "1.10"
uuid = "1"

[dev-dependencies]
pacs-core = { path = "../../../crates/pacs-core", features = ["fixtures"] }

# 发布构建:体积和启动速度对桌面分发有直接影响
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# MPR is numeric hot-loop code. Keep `tauri dev` responsive without paying the
# compile-time cost of optimizing the complete Tauri dependency graph.
[profile.dev.package.pacs-viewer]
opt-level = 2

[profile.dev.package.pacs-codec]
opt-level = 2
