[package]
name = "pacs-codec"
description = "像素解码、缩略图、帧提取(CPU 密集,独立线程池)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# 让本 crate 的测试能用 pacs-core 的合成 DICOM 夹具
