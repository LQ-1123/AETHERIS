[dependencies]
pacs-core.workspace = true
dicom.workspace = true
dicom-pixeldata.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
pacs-core = { workspace = true, features = ["fixtures"] }
