<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Remote PACS · API 检测中心</title>
  <style>
    :root{color-scheme:dark;--bg:#081019;--panel:#101b27;--line:#26384b;--text:#e6eef6;--muted:#91a4b7;--cyan:#45d4cb;--blue:#4b93ff;--green:#51d88a;--red:#ff6b7a;--amber:#ffc857}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#17304a 0,transparent 32%),var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1600px;margin:auto;padding:26px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.mark{width:46px;height:46px;border:1px solid #4bded3;border-radius:14px;display:grid;place-items:center;background:#0d2831;box-shadow:0 0 28px #45d4cb33;font-size:22px}.title h1{font-size:22px;margin:0}.title p{margin:3px 0 0;color:var(--muted)}.status{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
    .grid{display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px}.panel{background:#101b27e8;border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px #0004}.side{padding:16px;align-self:start;position:sticky;top:16px}.section{padding:14px 0;border-bottom:1px solid var(--line)}.section:last-child{border:0}.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}.field{display:grid;gap:6px;margin:9px 0}.field label{color:var(--muted);font-size:12px}.input,textarea,select{width:100%;border:1px solid var(--line);background:#09131e;color:var(--text);padding:10px 11px;border-radius:9px;outline:none}.input:focus,textarea:focus,select:focus{border-color:var(--cyan)}textarea{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.row{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#172638;color:var(--text);border-radius:9px;padding:9px 12px}.btn:hover{border-color:#52708e}.btn.primary{background:linear-gradient(135deg,#277aa4,#237f78);border-color:#45d4cb;color:white}.btn.danger{border-color:#733844;color:#ff9aa5}.btn:disabled{opacity:.45;cursor:not-allowed}.grow{flex:1}.token{font-family:ui-monospace;font-size:11px;color:var(--green);overflow-wrap:anywhere}.warning{padding:9px 11px;border-radius:9px;background:#342713;border:1px solid #684c1c;color:#ffd98c;font-size:12px}
    .main{overflow:hidden}.toolbar{padding:15px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{min-width:240px;flex:1}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:15px;border-bottom:1px solid var(--line)}.metric{background:#0b1621;border:1px solid #203247;border-radius:11px;padding:11px}.metric b{font-size:21px;display:block}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.content{display:grid;grid-template-columns:minmax(380px,45%) minmax(420px,55%);min-height:660px}.catalog{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 235px)}.endpoint{display:grid;grid-template-columns:62px 1fr 24px;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid #1b2b3c;cursor:pointer}.endpoint:hover,.endpoint.active{background:#162536}.method{font-size:11px;font-weight:800;text-align:center;padding:4px;border-radius:5px}.GET{color:#7ee2ac;background:#143628}.POST{color:#7eb7ff;background:#142f52}.PUT,.PATCH{color:#ffd47e;background:#413218}.DELETE{color:#ff8794;background:#461e27}.path{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis}.summary{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultmark{font-size:13px}.editor{padding:16px;overflow:auto;max-height:calc(100vh - 235px)}.editor h3{margin:0 0 5px;font:600 15px ui-monospace}.editor .desc{color:var(--muted);margin-bottom:14px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:3px 8px;color:var(--muted)}.response{margin-top:14px;border:1px solid var(--line);border-radius:11px;overflow:hidden}.response-head{display:flex;justify-content:space-between;padding:8px 11px;background:#132131}.response pre{margin:0;padding:12px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#08111a;font:11px/1.5 ui-monospace;color:#c9d7e4}.ok{color:var(--green)}.fail{color:var(--red)}.skip{color:var(--amber)}.hidden{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:1fr}.side{position:static}.content{grid-template-columns:1fr}.catalog{border-right:0;border-bottom:1px solid var(--line);max-height:420px}.editor{max-height:none}.metrics{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body><div class="shell">
  <header class="top"><div class="brand"><div class="mark">✣</div><div class="title"><h1>API 检测中心</h1><p>Remote PACS · 接口清单、认证扫描与请求调试</p></div></div><div class="status"><span class="dot" id="healthDot"></span><span id="healthText">等待加载</span></div></header>
  <div class="grid"><aside class="panel side">
    <div class="section"><h2>连接</h2><div class="field"><label>服务地址</label><input class="input" id="baseUrl"></div><div class="row"><button class="btn primary grow" id="loadBtn">加载接口</button><button class="btn" id="exportBtn">导出</button></div></div>
    <div class="section"><h2>用户认证</h2><div class="field"><label>用户名</label><input class="input" id="username" autocomplete="username"></div><div class="field"><label>密码</label><input class="input" id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">登录并保存 Token</button><div class="field"><label>Bearer Token / API Key</label><textarea id="token" style="min-height:76px" placeholder="可直接粘贴 JWT 或 pacs_sk_*"></textarea></div><div class="token" id="identity">尚未认证</div></div>
    <div class="section"><h2>批量检测</h2><div class="warning">“认证防护扫描”不会执行写操作。“GET 冒烟”只运行无路径占位符的 GET；POST/PUT/PATCH/DELETE 必须在右侧明确填写参数后手动发送。</div><div class="row" style="margin-top:10px"><button class="btn grow" id="authScanBtn">认证防护扫描</button><button class="btn grow" id="getScanBtn">GET 冒烟</button></div><button class="btn danger" style="margin-top:8px;width:100%" id="clearBtn">清空检测结果</button></div>
  </aside>
  <main class="panel main"><div class="toolbar"><input class="input search" id="search" placeholder="搜索路径、方法或说明"><select id="methodFilter" style="width:110px"><option value="">全部方法</option><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select><select id="resultFilter" style="width:120px"><option value="">全部结果</option><option value="ok">成功</option><option value="fail">失败</option><option value="skip">跳过</option></select><span id="coverage" class="chip">0 APIs</span></div>
    <div class="metrics"><div class="metric"><b id="mTotal">0</b><span>接口总数</span></div><div class="metric"><b id="mTested">0</b><span>已检测</span></div><div class="metric"><b class="ok" id="mOk">0</b><span>成功</span></div><div class="metric"><b class="fail" id="mFail">0</b><span>失败</span></div><div class="metric"><b class="skip" id="mSkip">0</b><span>跳过</span></div></div>
    <div class="content"><div class="catalog" id="catalog"></div><div class="editor" id="editor"><p class="desc">从左侧选择一个接口开始检测。</p></div></div>
  </main></div>
</div>
<script>
const $=id=>document.getElementById(id);const METHODS=['get','post','put','patch','delete'];let endpoints=[],selected=null,results=new Map();
const supplemental=[
['POST','/api/v1/auth/login','用户登录'],['POST','/api/v1/auth/refresh','刷新令牌'],['POST','/api/v1/auth/logout','退出登录'],['POST','/api/v1/auth/change-password','修改密码'],['POST','/api/v1/auth/password-reset-requests','提交密码重置申请'],
['GET','/api/patients','病人工作列表'],['GET','/api/patients/{patient_id}/studies','病人检查'],['GET','/api/studies/{study_uid}/series','检查序列'],
['GET','/api/window-presets','个人窗预设'],['POST','/api/window-presets','保存个人窗预设'],['PATCH','/api/window-presets/{preset_id}','重命名个人窗预设'],['DELETE','/api/window-presets/{preset_id}','删除个人窗预设'],
['GET','/api/studies/{study_uid}/series/{series_uid}/annotations','共享标注'],['POST','/api/studies/{study_uid}/series/{series_uid}/annotations','创建共享标注'],['PATCH','/api/studies/{study_uid}/series/{series_uid}/annotations/{annotation_id}','更新共享标注'],
['GET','/api/studies/{study_uid}/series/{series_uid}/segmentations','分割项目'],['POST','/api/studies/{study_uid}/series/{series_uid}/segmentations','创建分割项目'],['DELETE','/api/studies/{study_uid}/series/{series_uid}/segmentations/{project_id}','删除分割项目'],
['GET','/api/studies/{study_uid}/series/{series_uid}/segmentations/{project_id}/segments','分割 Segment'],['PATCH','/api/studies/{study_uid}/series/{series_uid}/segmentations/{project_id}/segments/{segment_id}','更新 Segment'],['GET','/api/studies/{study_uid}/series/{series_uid}/segmentations/{project_id}/masks','分割 Mask'],['PUT','/api/studies/{study_uid}/series/{series_uid}/segmentations/{project_id}/segments/{segment_id}/mask','写入 Mask'],['GET','/api/studies/{study_uid}/series/{series_uid}/segmentations/{project_id}/segments/{segment_id}/masks','Segment 全部 Mask'],['PUT','/api/studies/{study_uid}/series/{series_uid}/segmentations/{project_id}/segments/{segment_id}/masks','批量写入 Mask'],
['GET','/api/dicom/schema','DICOM 修订 Schema'],['POST','/api/dicom/transformations/preview','修订预览'],['GET','/api/dicom/transformations','修订任务'],['POST','/api/dicom/transformations','确认修订'],['GET','/api/dicom/transformations/{job_id}','修订任务详情'],['GET','/api/dicom/instances/by-sop/{sop_uid}/revisions','按 SOP 查询版本'],['GET','/api/dicom/instances/{logical_id}/revisions','逻辑实例版本'],['POST','/api/dicom/instances/{logical_id}/rollback','回滚预览'],
['POST','/api/v1/exports','创建导出'],['GET','/api/v1/exports/{job_id}','导出状态'],['DELETE','/api/v1/exports/{job_id}','取消导出'],['GET','/api/v1/exports/{job_id}/download','下载导出'],
['POST','/api/v1/worklist/{work_id}/release','释放工作项'],['POST','/api/v1/worklist/{work_id}/assign','转派工作项'],['GET','/api/v1/studies/{study_uid}/clinical-context','临床上下文'],
['GET','/api/v1/exam-requests','申请单列表'],['POST','/api/v1/exam-requests','创建申请单'],['PUT','/api/v1/exam-requests/{request_id}','编辑待执行申请单'],['POST','/api/v1/exam-requests/{request_id}/bind','绑定已入库检查'],['GET','/api/v1/exam-requests/study-candidates','可绑定检查'],['GET','/api/v1/exam-requests/study/{study_uid}','检查申请信息'],['GET','/api/v1/workload','管理员工作量报表'],
['POST','/api/v1/reports/{report_id}/submit','提交报告审核'],['POST','/api/v1/reports/{report_id}/review/start','开始审核'],['POST','/api/v1/reports/{report_id}/review/approve','审核并签发'],['GET','/api/v1/reports/{report_id}/review-events','报告审核记录'],['POST','/api/v1/reports/{report_id}/amendments','创建报告修订'],['GET','/api/v1/reports/{report_id}/versions','报告版本'],
['GET','/dicomweb/studies','QIDO 检查查询'],['GET','/dicomweb/studies/{study_uid}/series','QIDO 序列查询'],['GET','/dicomweb/studies/{study_uid}/series/{series_uid}/instances','QIDO 实例查询'],
['GET','/dicomweb/studies/{study_uid}/series/{series_uid}/instances/{sop_uid}','WADO 实例'],['GET','/dicomweb/studies/{study_uid}/series/{series_uid}/instances/{sop_uid}/metadata','WADO 元数据'],['GET','/dicomweb/studies/{study_uid}/series/{series_uid}/instances/{sop_uid}/frames/{frames}','WADO 帧'],['POST','/dicomweb/studies','STOW-RS']
];
function base(){return $('baseUrl').value.replace(/\/$/,'')}function key(e){return e.method+' '+e.path}function auth(){return $('token').value.trim()}function headers(json=true,withAuth=true){let h={};if(json)h['Content-Type']='application/json';if(withAuth&&auth())h.Authorization='Bearer '+auth();return h}
async function load(){setHealth('loading','加载中…');try{let r=await fetch(base()+'/api/v1/openapi.json');if(!r.ok)throw new Error('OpenAPI HTTP '+r.status);let spec=await r.json(),map=new Map();for(let [path,item] of Object.entries(spec.paths||{}))for(let m of METHODS)if(item[m]){let op=item[m];map.set(m.toUpperCase()+' '+path,{method:m.toUpperCase(),path,summary:op.summary||op.description||'',security:op.security!==undefined,source:'OpenAPI'});}for(let [method,path,summary] of supplemental){let k=method+' '+path;if(!map.has(k))map.set(k,{method,path,summary,security:!path.includes('/auth/login'),source:'路由清单'});}endpoints=[...map.values()].sort((a,b)=>a.path.localeCompare(b.path)||a.method.localeCompare(b.method));render();setHealth('ok','已连接 · '+endpoints.length+' 个接口');}catch(e){setHealth('fail','加载失败');$('editor').innerHTML='<p class="fail">'+escapeHtml(e.message)+'</p>';}}
function setHealth(state,text){$('healthText').textContent=text;$('healthDot').style.background=state==='ok'?'var(--green)':state==='fail'?'var(--red)':'var(--amber)'}
function render(){let q=$('search').value.toLowerCase(),mf=$('methodFilter').value,rf=$('resultFilter').value;let shown=endpoints.filter(e=>(!mf||e.method===mf)&&(!q||(key(e)+' '+e.summary).toLowerCase().includes(q))&&(!rf||results.get(key(e))?.state===rf));$('catalog').innerHTML=shown.map(e=>{let r=results.get(key(e));return `<div class="endpoint ${selected&&key(selected)===key(e)?'active':''}" data-key="${escapeHtml(key(e))}"><span class="method ${e.method}">${e.method}</span><div><div class="path">${escapeHtml(e.path)}</div><div class="summary">${escapeHtml(e.summary||'未提供说明')}</div></div><span class="resultmark ${r?.state||''}">${r?r.state==='ok'?'●':r.state==='fail'?'●':'◐':''}</span></div>`}).join('');for(let el of document.querySelectorAll('.endpoint'))el.onclick=()=>select(endpoints.find(e=>key(e)===el.dataset.key));metrics();$('coverage').textContent=endpoints.length+' APIs · OpenAPI + 路由补充';}
function select(e){selected=e;render();let placeholders=[...e.path.matchAll(/\{([^}]+)\}/g)].map(x=>x[1]),hint=e.method==='GET'?'GET 通常无需请求体':'{&quot;example&quot;:&quot;value&quot;}';$('editor').innerHTML=`<h3><span class="method ${e.method}">${e.method}</span> ${escapeHtml(e.path)}</h3><div class="desc">${escapeHtml(e.summary||'暂无说明')}</div><div class="chips"><span class="chip">${e.source}</span><span class="chip">${e.security?'需要认证':'公开接口'}</span></div>${placeholders.map(p=>`<div class="field"><label>${escapeHtml(p)}</label><input class="input path-param" data-name="${escapeHtml(p)}" placeholder="填写路径参数"></div>`).join('')}<div class="field"><label>Query String（不含 ?）</label><input class="input" id="queryInput" placeholder="limit=20&status=pending"></div><div class="field"><label>请求体 JSON / 文本</label><textarea id="bodyInput" placeholder="${hint}"></textarea></div><div class="row"><button class="btn primary" id="sendBtn">发送请求</button><button class="btn" id="copyCurlBtn">复制 cURL</button></div><div id="responseBox"></div>`;$('sendBtn').onclick=()=>sendSelected();$('copyCurlBtn').onclick=copyCurl;}
function resolvePath(){let p=selected.path;for(let i of document.querySelectorAll('.path-param')){if(!i.value)throw new Error('请填写路径参数 '+i.dataset.name);p=p.replace('{'+i.dataset.name+'}',encodeURIComponent(i.value));}let q=$('queryInput').value.trim();return p+(q?'?'+q:'')}
async function request(e,path,withAuth=true,bodyText=''){let started=performance.now(),opts={method:e.method,headers:headers(!!bodyText,withAuth)};if(bodyText)opts.body=bodyText;try{let r=await fetch(base()+path,opts),text=await r.text();return{state:r.ok?'ok':'fail',status:r.status,ms:Math.round(performance.now()-started),body:text,headers:Object.fromEntries(r.headers.entries())}}catch(err){return{state:'fail',status:0,ms:Math.round(performance.now()-started),body:String(err),headers:{}}}}
async function sendSelected(){try{let p=resolvePath(),r=await request(selected,p,true,$('bodyInput').value.trim());results.set(key(selected),r);showResponse(r);render();}catch(e){showResponse({state:'fail',status:0,ms:0,body:e.message,headers:{}})}}
function showResponse(r){$('responseBox').innerHTML=`<div class="response"><div class="response-head"><b class="${r.state}">HTTP ${r.status||'ERR'}</b><span>${r.ms} ms</span></div><pre>${escapeHtml(pretty(r.body))}</pre></div>`}
async function login(){let body=JSON.stringify({username:$('username').value,password:$('password').value});let e={method:'POST',path:'/api/v1/auth/login'},r=await request(e,e.path,false,body);if(r.status===200){let data=JSON.parse(r.body);$('token').value=data.access_token;$('identity').textContent=`${data.user.display_name||data.user.username} · ${data.user.role} · 机构 ${data.user.institution_id}`;sessionStorage.setItem('pacs_api_token',data.access_token);setHealth('ok','登录成功');}else{$('identity').textContent='登录失败 · HTTP '+r.status;setHealth('fail','认证失败');}}
async function authScan(){if(!confirm('将对所有标记为需要认证的接口发送无 Token 请求。写接口不会携带请求体，也不会获得授权，因此不会执行实际变更。继续？'))return;for(let e of endpoints){if(!e.security)continue;let p=e.path.replace(/\{[^}]+\}/g,'__api_checker_invalid__'),r=await request(e,p,false,'');let protectedOk=[401,403,404,405,415,422].includes(r.status);results.set(key(e),{...r,state:protectedOk?'ok':'fail',body:`认证防护扫描：期望拒绝，实际 HTTP ${r.status}\n`+r.body});render();}setHealth(results.size&&[...results.values()].some(x=>x.state==='fail')?'fail':'ok','认证防护扫描完成');}
async function getScan(){for(let e of endpoints){if(e.method!=='GET'||e.path.includes('{')){if(e.method==='GET')results.set(key(e),{state:'skip',status:0,ms:0,body:'含路径参数，已跳过',headers:{}});continue;}let r=await request(e,e.path,true);results.set(key(e),r);render();}setHealth([...results.values()].some(x=>x.state==='fail')?'fail':'ok','GET 冒烟完成');}
function copyCurl(){try{let p=resolvePath(),body=$('bodyInput').value.trim(),parts=[`curl -i -X ${selected.method}`,`'${base()+p}'`];if(auth())parts.push(`-H 'Authorization: Bearer ${auth()}'`);if(body)parts.push(`-H 'Content-Type: application/json' --data '${body.replaceAll("'","'\\''")}'`);navigator.clipboard.writeText(parts.join(' \\\n  '));}catch(e){alert(e.message)}}
function metrics(){let vals=[...results.values()];$('mTotal').textContent=endpoints.length;$('mTested').textContent=vals.length;$('mOk').textContent=vals.filter(x=>x.state==='ok').length;$('mFail').textContent=vals.filter(x=>x.state==='fail').length;$('mSkip').textContent=vals.filter(x=>x.state==='skip').length}
function exportResults(){let blob=new Blob([JSON.stringify({exported_at:new Date().toISOString(),base_url:base(),results:Object.fromEntries(results)},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='remote-pacs-api-check-'+new Date().toISOString().replaceAll(':','-')+'.json';a.click();URL.revokeObjectURL(a.href)}
function pretty(s){try{return JSON.stringify(JSON.parse(s),null,2)}catch{return s||'(空响应体)'}}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('baseUrl').value=location.origin;$('token').value=sessionStorage.getItem('pacs_api_token')||'';$('loadBtn').onclick=load;$('loginBtn').onclick=login;$('authScanBtn').onclick=authScan;$('getScanBtn').onclick=getScan;$('clearBtn').onclick=()=>{results.clear();render()};$('exportBtn').onclick=exportResults;for(let id of ['search','methodFilter','resultFilter'])$(id).oninput=render;load();
</script></body></html>
