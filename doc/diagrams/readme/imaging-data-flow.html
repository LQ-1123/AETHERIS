<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AETHERIS imaging data flow</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101214; }
    body { display: grid; place-items: center; }
    svg { display: block; width: min(100vw, 1280px); height: auto; }
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="imaging-data-flow-title imaging-data-flow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="imaging-data-flow-title">AETHERIS imaging data flow</title>
  <desc id="imaging-data-flow-desc">Data flow showing DICOM acquisition, durable persistence, metadata indexing, DICOMweb retrieval, visualization, and the resulting report or local AI artifact.</desc>
  <defs>
    <marker id="imaging-data-flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#78939a"/>
    </marker>
    <marker id="imaging-data-flow-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#58b8c7"/>
    </marker>
    <style>
      .bg { fill: #101214; }
      .lane-a { fill: #111b20; fill-opacity: .40; }
      .lane-b { fill: #15181a; fill-opacity: .56; }
      .rule { stroke: #34383b; stroke-width: 1; }
      .node { fill: #15181a; stroke: #4b5256; stroke-width: 1; }
      .node-store { fill: #121a1d; stroke: #52717a; stroke-width: 1; }
      .node-focal { fill: #122328; stroke: #58b8c7; stroke-width: 2; }
      .step-chip { fill: #1b2529; stroke: #52717a; stroke-width: 1; }
      .step-chip-focal { fill: #17343a; stroke: #58b8c7; stroke-width: 1; }
      .payload { fill: #1b2529; stroke: #52717a; stroke-width: 1; }
      .title { fill: #e7e9eb; font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #9fc3cd; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #9fc3cd; font: 600 8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .16em; }
      .lane-label { fill: #9fc3cd; font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
      .name { fill: #e7e9eb; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #9fc3cd; font: 400 8px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step-number { fill: #e7e9eb; font: 700 8px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .step-number-focal { fill: #58b8c7; font: 700 8px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .connector { fill: none; stroke: #78939a; stroke-width: 2; marker-end: url(#imaging-data-flow-arrow); }
      .connector-accent { fill: none; stroke: #58b8c7; stroke-width: 2; marker-end: url(#imaging-data-flow-arrow-accent); }
      .label-mask { fill: #101214; }
      .edge-label { fill: #58b8c7; font: 600 8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
      .legend { fill: #9fc3cd; font: 500 8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="eyebrow" x="40" y="28">IMAGING DATA FLOW</text>
  <text class="title" x="40" y="60">DICOM object to clinical artifact</text>
  <text class="subtitle" x="40" y="84">Original bytes remain durable while indexed metadata and pixel frames serve workflow, visualization, reporting, and local AI</text>

  <rect class="lane-a" x="40" y="160" width="1200" height="132"/>
  <rect class="lane-b" x="40" y="292" width="1200" height="132"/>
  <rect class="lane-a" x="40" y="424" width="1200" height="132"/>
  <line class="rule" x1="160" y1="160" x2="160" y2="556"/>
  <line class="rule" x1="40" y1="160" x2="1240" y2="160"/>
  <line class="rule" x1="40" y1="292" x2="1240" y2="292"/>
  <line class="rule" x1="40" y1="424" x2="1240" y2="424"/>
  <line class="rule" x1="40" y1="556" x2="1240" y2="556"/>

  <text class="lane-label" x="56" y="228">ACQUISITION</text>
  <text class="lane-label" x="56" y="360">PACS CORE</text>
  <text class="lane-label" x="56" y="492">CLINICAL APPS</text>

  <g>
    <rect class="step-chip" x="230" y="112" width="40" height="20" rx="4"/>
    <text class="step-number" x="250" y="124" text-anchor="middle">01</text>
    <text class="eyebrow" x="250" y="148" text-anchor="middle">ACQUIRE</text>
    <rect class="step-chip" x="410" y="112" width="40" height="20" rx="4"/>
    <text class="step-number" x="430" y="124" text-anchor="middle">02</text>
    <text class="eyebrow" x="430" y="148" text-anchor="middle">PERSIST</text>
    <rect class="step-chip" x="590" y="112" width="40" height="20" rx="4"/>
    <text class="step-number" x="610" y="124" text-anchor="middle">03</text>
    <text class="eyebrow" x="610" y="148" text-anchor="middle">INDEX</text>
    <rect class="step-chip" x="770" y="112" width="40" height="20" rx="4"/>
    <text class="step-number" x="790" y="124" text-anchor="middle">04</text>
    <text class="eyebrow" x="790" y="148" text-anchor="middle">RETRIEVE</text>
    <rect class="step-chip-focal" x="950" y="112" width="40" height="20" rx="4"/>
    <text class="step-number-focal" x="970" y="124" text-anchor="middle">05</text>
    <text class="eyebrow" x="970" y="148" text-anchor="middle">VISUALIZE</text>
    <rect class="step-chip" x="1130" y="112" width="40" height="20" rx="4"/>
    <text class="step-number" x="1150" y="124" text-anchor="middle">06</text>
    <text class="eyebrow" x="1150" y="148" text-anchor="middle">DELIVER</text>
  </g>

  <!-- Data handoffs before nodes. -->
  <path class="connector" d="M318 224 H422 Q430 224 430 232 V316"/>
  <line class="connector" x1="498" y1="356" x2="542" y2="356"/>
  <path class="connector" d="M678 356 H782 Q790 356 790 364 V448"/>
  <line class="connector-accent" x1="858" y1="488" x2="902" y2="488"/>
  <rect class="label-mask" x="860" y="464" width="40" height="12" rx="4"/>
  <text class="edge-label" x="880" y="472" text-anchor="middle">PIXELS</text>
  <line class="connector" x1="1038" y1="488" x2="1082" y2="488"/>

  <g>
    <rect class="node" x="182" y="184" width="136" height="80" rx="8"/>
    <text class="name" x="250" y="212" text-anchor="middle">DICOM objects</text>
    <text class="sub" x="250" y="232" text-anchor="middle">C-STORE · STOW-RS</text>
    <rect class="payload" x="226" y="240" width="48" height="16" rx="4"/>
    <text class="eyebrow" x="250" y="252" text-anchor="middle">DICOM</text>
  </g>

  <g>
    <rect class="node-store" x="362" y="316" width="136" height="80" rx="8"/>
    <text class="name" x="430" y="344" text-anchor="middle">Durable ingest</text>
    <text class="sub" x="430" y="364" text-anchor="middle">atomic file + metadata</text>
    <rect class="payload" x="406" y="372" width="48" height="16" rx="4"/>
    <text class="eyebrow" x="430" y="384" text-anchor="middle">FILE</text>
  </g>

  <g>
    <rect class="node-store" x="542" y="316" width="136" height="80" rx="8"/>
    <text class="name" x="610" y="344" text-anchor="middle">Metadata index</text>
    <text class="sub" x="610" y="364" text-anchor="middle">PostgreSQL hierarchy</text>
    <rect class="payload" x="586" y="372" width="48" height="16" rx="4"/>
    <text class="eyebrow" x="610" y="384" text-anchor="middle">INDEX</text>
  </g>

  <g>
    <rect class="node" x="722" y="448" width="136" height="80" rx="8"/>
    <text class="name" x="790" y="476" text-anchor="middle">Query &amp; retrieve</text>
    <text class="sub" x="790" y="496" text-anchor="middle">QIDO-RS · WADO-RS</text>
    <rect class="payload" x="766" y="504" width="48" height="16" rx="4"/>
    <text class="eyebrow" x="790" y="516" text-anchor="middle">FRAME</text>
  </g>

  <g>
    <rect class="node-focal" x="902" y="448" width="136" height="80" rx="8"/>
    <text class="name" x="970" y="476" text-anchor="middle">Viewer &amp; MPR</text>
    <text class="sub" x="970" y="496" text-anchor="middle">2D · MIP · MinIP · VR</text>
    <rect class="payload" x="946" y="504" width="48" height="16" rx="4"/>
    <text class="eyebrow" x="970" y="516" text-anchor="middle">VIEW</text>
  </g>

  <g>
    <rect class="node" x="1082" y="448" width="136" height="80" rx="8"/>
    <text class="name" x="1150" y="476" text-anchor="middle">Report · local AI</text>
    <text class="sub" x="1150" y="496" text-anchor="middle">versioned clinical output</text>
    <rect class="payload" x="1126" y="504" width="48" height="16" rx="4"/>
    <text class="eyebrow" x="1150" y="516" text-anchor="middle">RESULT</text>
  </g>

  <line x1="40" y1="612" x2="1240" y2="612" stroke="#34383b" stroke-width="1"/>
  <text class="legend" x="40" y="644">PAYLOAD TAGS TRACE THE REPRESENTATION</text>
  <text class="legend" x="360" y="644">ACCENT = PIXEL PATH INTO THE VIEWER</text>
  <line x1="656" y1="640" x2="704" y2="640" stroke="#58b8c7" stroke-width="2" marker-end="url(#imaging-data-flow-arrow-accent)"/>
  <text class="legend" x="744" y="644">ORIGINAL DICOM BYTES REMAIN IN DURABLE STORAGE</text>
</svg>
</body>
</html>
