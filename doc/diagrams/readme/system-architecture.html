<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AETHERIS system architecture</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101214; }
    body { display: grid; place-items: center; }
    svg { display: block; width: min(100vw, 1280px); height: auto; }
  </style>
</head>
<body>
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="system-architecture-title system-architecture-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="system-architecture-title">AETHERIS system architecture</title>
  <desc id="system-architecture-desc">Architecture showing modalities and the desktop viewer connecting to the Rust PACS core, clinical workflow services, PostgreSQL, durable DICOM storage, background workers, and local AI.</desc>
  <defs>
    <marker id="system-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#78939a"/>
    </marker>
    <marker id="system-architecture-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#58b8c7"/>
    </marker>
    <style>
      .bg { fill: #101214; }
      .zone { fill: #111b20; fill-opacity: .48; stroke: #34383b; stroke-width: 1; stroke-dasharray: 8 8; }
      .zone-tag { fill: #101214; }
      .node { fill: #15181a; stroke: #4b5256; stroke-width: 1; }
      .node-store { fill: #121a1d; stroke: #52717a; stroke-width: 1; }
      .node-focal { fill: #122328; stroke: #58b8c7; stroke-width: 2; }
      .tag { fill: none; stroke: #52717a; stroke-width: 1; }
      .tag-focal { fill: #17343a; stroke: #58b8c7; stroke-width: 1; }
      .title { fill: #e7e9eb; font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #9fc3cd; font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill: #9fc3cd; font: 600 8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .16em; }
      .name { fill: #e7e9eb; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .sub { fill: #9fc3cd; font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .connector { fill: none; stroke: #78939a; stroke-width: 2; marker-end: url(#system-architecture-arrow); }
      .connector-accent { fill: none; stroke: #58b8c7; stroke-width: 2; marker-end: url(#system-architecture-arrow-accent); }
      .connector-dashed { fill: none; stroke: #78939a; stroke-width: 2; stroke-dasharray: 8 8; marker-end: url(#system-architecture-arrow); }
      .label-mask { fill: #101214; }
      .edge-label { fill: #9fc3cd; font: 600 8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
      .legend { fill: #9fc3cd; font: 500 8px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="eyebrow" x="40" y="28">SYSTEM ARCHITECTURE</text>
  <text class="title" x="40" y="60">AETHERIS · Medical imaging infrastructure</text>
  <text class="subtitle" x="40" y="84">Standards-based acquisition, durable storage, clinical workflow, visualization, and local compute</text>

  <rect class="zone" x="40" y="120" width="280" height="480" rx="8"/>
  <rect class="zone-tag" x="56" y="124" width="96" height="16" rx="4"/>
  <text class="eyebrow" x="64" y="136">CLINICAL EDGE</text>

  <rect class="zone" x="344" y="120" width="440" height="480" rx="8"/>
  <rect class="zone-tag" x="360" y="124" width="88" height="16" rx="4"/>
  <text class="eyebrow" x="368" y="136">PACS CORE</text>

  <rect class="zone" x="808" y="120" width="432" height="480" rx="8"/>
  <rect class="zone-tag" x="824" y="124" width="112" height="16" rx="4"/>
  <text class="eyebrow" x="832" y="136">DATA &amp; COMPUTE</text>

  <!-- Connectors are drawn before nodes. -->
  <path class="connector-accent" d="M288 244 H344 Q352 244 352 252 V264 Q352 272 360 272 H400"/>
  <rect class="label-mask" x="296" y="216" width="88" height="12" rx="4"/>
  <text class="edge-label" x="340" y="224" text-anchor="middle">DIMSE / STOW</text>

  <path class="connector" d="M288 448 H336 Q344 448 344 440 V320 Q344 312 352 312 H400"/>
  <rect class="label-mask" x="296" y="424" width="48" height="12" rx="4"/>
  <text class="edge-label" x="320" y="432" text-anchor="middle">HTTPS</text>

  <path class="connector" d="M728 260 H784 Q792 260 792 252 V244 H848"/>
  <rect class="label-mask" x="736" y="236" width="64" height="12" rx="4"/>
  <text class="edge-label" x="768" y="244" text-anchor="middle">METADATA</text>

  <path class="connector-accent" d="M728 316 H1116 Q1124 316 1124 308 V292"/>
  <rect class="label-mask" x="760" y="292" width="80" height="12" rx="4"/>
  <text class="edge-label" x="800" y="300" text-anchor="middle">DICOM BYTES</text>

  <line class="connector" x1="564" y1="348" x2="564" y2="408"/>
  <rect class="label-mask" x="580" y="368" width="56" height="12" rx="4"/>
  <text class="edge-label" x="608" y="376" text-anchor="middle">CLINICAL</text>

  <path class="connector-dashed" d="M640 348 V376 Q640 384 648 384 H1020 Q1028 384 1028 392 V408"/>
  <rect class="label-mask" x="752" y="360" width="56" height="12" rx="4"/>
  <text class="edge-label" x="780" y="368" text-anchor="middle">JOBS / AI</text>

  <line class="connector" x1="728" y1="456" x2="848" y2="456"/>
  <rect class="label-mask" x="756" y="432" width="64" height="12" rx="4"/>
  <text class="edge-label" x="788" y="440" text-anchor="middle">RESULTS</text>

  <g>
    <rect class="node" x="72" y="196" width="216" height="96" rx="8"/>
    <rect class="tag" x="84" y="208" width="64" height="16" rx="4"/>
    <text class="eyebrow" x="116" y="220" text-anchor="middle">SOURCE</text>
    <text class="name" x="180" y="248" text-anchor="middle">Modalities &amp; upload clients</text>
    <text class="sub" x="180" y="268" text-anchor="middle">DICOM · DICOMweb</text>
  </g>

  <g>
    <rect class="node" x="72" y="400" width="216" height="96" rx="8"/>
    <rect class="tag" x="84" y="412" width="64" height="16" rx="4"/>
    <text class="eyebrow" x="116" y="424" text-anchor="middle">DESKTOP</text>
    <text class="name" x="180" y="452" text-anchor="middle">AETHERIS Viewer</text>
    <text class="sub" x="180" y="472" text-anchor="middle">Tauri · 2D / MPR / VR</text>
  </g>

  <g>
    <rect class="node-focal" x="400" y="236" width="328" height="112" rx="8"/>
    <rect class="tag-focal" x="412" y="248" width="80" height="16" rx="4"/>
    <text class="eyebrow" x="452" y="260" text-anchor="middle">RUST CORE</text>
    <text class="name" x="564" y="292" text-anchor="middle">PACS service</text>
    <text class="sub" x="564" y="316" text-anchor="middle">DIMSE · DICOMweb · Auth · Clinical API</text>
  </g>

  <g>
    <rect class="node" x="400" y="408" width="328" height="96" rx="8"/>
    <rect class="tag" x="412" y="420" width="80" height="16" rx="4"/>
    <text class="eyebrow" x="452" y="432" text-anchor="middle">WORKFLOW</text>
    <text class="name" x="564" y="460" text-anchor="middle">Requests · reports · review</text>
    <text class="sub" x="564" y="480" text-anchor="middle">institution-scoped state</text>
  </g>

  <g>
    <rect class="node-store" x="848" y="196" width="168" height="96" rx="8"/>
    <rect class="tag" x="860" y="208" width="48" height="16" rx="4"/>
    <text class="eyebrow" x="884" y="220" text-anchor="middle">INDEX</text>
    <text class="name" x="932" y="248" text-anchor="middle">PostgreSQL</text>
    <text class="sub" x="932" y="268" text-anchor="middle">metadata · audit</text>
  </g>

  <g>
    <rect class="node-store" x="1040" y="196" width="168" height="96" rx="8"/>
    <rect class="tag" x="1052" y="208" width="48" height="16" rx="4"/>
    <text class="eyebrow" x="1076" y="220" text-anchor="middle">STORE</text>
    <text class="name" x="1124" y="248" text-anchor="middle">DICOM objects</text>
    <text class="sub" x="1124" y="268" text-anchor="middle">durable filesystem</text>
  </g>

  <g>
    <rect class="node" x="848" y="408" width="360" height="96" rx="8"/>
    <rect class="tag" x="860" y="420" width="64" height="16" rx="4"/>
    <text class="eyebrow" x="892" y="432" text-anchor="middle">COMPUTE</text>
    <text class="name" x="1028" y="460" text-anchor="middle">Background workers &amp; local AI</text>
    <text class="sub" x="1028" y="480" text-anchor="middle">routing · lifecycle · segmentation</text>
  </g>

  <line x1="40" y1="648" x2="1240" y2="648" stroke="#34383b" stroke-width="1"/>
  <text class="legend" x="40" y="676">SOLID = REQUEST / DATA</text>
  <line x1="232" y1="672" x2="280" y2="672" stroke="#78939a" stroke-width="2" marker-end="url(#system-architecture-arrow)"/>
  <text class="legend" x="304" y="676">DASHED = ASYNC WORK</text>
  <line x1="520" y1="672" x2="568" y2="672" stroke="#78939a" stroke-width="2" stroke-dasharray="8 8" marker-end="url(#system-architecture-arrow)"/>
  <text class="legend" x="592" y="676">ACCENT = PRIMARY IMAGING PATH</text>
  <line x1="856" y1="672" x2="904" y2="672" stroke="#58b8c7" stroke-width="2" marker-end="url(#system-architecture-arrow-accent)"/>
</svg>
</body>
</html>
