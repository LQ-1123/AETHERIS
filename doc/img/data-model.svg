<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Remote PACS 核心数据模型</title>
  <desc id="desc">核心影像层级、版本链、账号审计、后台任务、路由生命周期、标注分割实体关系。</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#697680"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f6f8fa}.group{fill:#fff;stroke:#c6ced5;stroke-width:1.4}.entity{stroke-width:1.4;filter:url(#s)}.clinical{fill:#e8f3fb;stroke:#5080a1}.version{fill:#e9f5ee;stroke:#4b8067}.security{fill:#fff2df;stroke:#b47b31}.ops{fill:#f2eaf5;stroke:#85618f}.govern{fill:#f6efe8;stroke:#9a7654}.collab{fill:#edf4e6;stroke:#68884a}.title{font:700 30px system-ui,"PingFang SC",sans-serif;fill:#202a32}.group-title{font:700 18px system-ui,"PingFang SC",sans-serif;fill:#3b4852}.name{font:700 15px ui-monospace,"SFMono-Regular",monospace;fill:#26323b}.field{font:12px system-ui,"PingFang SC",sans-serif;fill:#53616b}.line{fill:none;stroke:#697680;stroke-width:1.5;marker-end:url(#a)}.dashed{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1040"/><text class="title" x="800" y="45" text-anchor="middle">Remote PACS 核心数据模型（逻辑视图）</text>

  <rect class="group" x="35" y="70" width="910" height="455" rx="8"/><text class="group-title" x="55" y="100">影像索引与不可变版本</text>
  <g><rect class="entity clinical" x="70" y="125" width="185" height="105" rx="5"/><text class="name" x="162" y="154" text-anchor="middle">institutions</text><text class="field" x="90" y="179">PK id</text><text class="field" x="90" y="201">name, code</text></g>
  <g><rect class="entity clinical" x="310" y="125" width="185" height="125" rx="5"/><text class="name" x="402" y="154" text-anchor="middle">patients</text><text class="field" x="330" y="179">PK id · FK institution</text><text class="field" x="330" y="201">patient_id, issuer</text><text class="field" x="330" y="223">name, birth_date, sex</text></g>
  <g><rect class="entity clinical" x="550" y="125" width="185" height="145" rx="5"/><text class="name" x="642" y="154" text-anchor="middle">studies</text><text class="field" x="570" y="179">PK id · FK patient</text><text class="field" x="570" y="201">StudyInstanceUID</text><text class="field" x="570" y="223">date, accession, modality[]</text><text class="field" x="570" y="245">storage_tier, last_access</text></g>
  <g><rect class="entity clinical" x="790" y="125" width="125" height="145" rx="5"/><text class="name" x="852" y="154" text-anchor="middle">series</text><text class="field" x="805" y="179">PK id</text><text class="field" x="805" y="201">FK study</text><text class="field" x="805" y="223">Series UID</text><text class="field" x="805" y="245">modality</text></g>
  <g><rect class="entity clinical" x="690" y="335" width="225" height="150" rx="5"/><text class="name" x="802" y="364" text-anchor="middle">instances</text><text class="field" x="710" y="389">PK id · FK series</text><text class="field" x="710" y="411">logical_instance_id (UUID)</text><text class="field" x="710" y="433">current_version_id</text><text class="field" x="710" y="455">SOP UID · geometry projection</text></g>
  <g><rect class="entity version" x="370" y="325" width="250" height="170" rx="5"/><text class="name" x="495" y="354" text-anchor="middle">dicom_instance_versions</text><text class="field" x="390" y="379">FK instance · version_number</text><text class="field" x="390" y="401">source_version_fk (self)</text><text class="field" x="390" y="423">immutable UID snapshot</text><text class="field" x="390" y="445">storage_path, SHA-256, size</text><text class="field" x="390" y="467">tier, reason, derivation_kind</text></g>
  <g><rect class="entity version" x="70" y="335" width="235" height="150" rx="5"/><text class="name" x="187" y="364" text-anchor="middle">dicom_transform_jobs</text><text class="field" x="90" y="389">preview / confirmation</text><text class="field" x="90" y="411">base revisions · rules</text><text class="field" x="90" y="433">clinical correction / rollback</text><text class="field" x="90" y="455">status, reason, pixel risk</text></g>
  <path class="line" d="M255 178 H310"/><path class="line" d="M495 188 H550"/><path class="line" d="M735 198 H790"/><path class="line" d="M852 270 V335"/><path class="line" d="M690 410 H620"/><path class="line" d="M370 410 H305"/><path class="line dashed" d="M495 495 Q495 515 570 495"/>

  <rect class="group" x="975" y="70" width="590" height="455" rx="8"/><text class="group-title" x="995" y="100">身份、任务与数据流转</text>
  <g><rect class="entity security" x="1010" y="125" width="155" height="125" rx="5"/><text class="name" x="1087" y="154" text-anchor="middle">users</text><text class="field" x="1028" y="179">institution</text><text class="field" x="1028" y="201">Argon2 hash</text><text class="field" x="1028" y="223">role, active</text></g>
  <g><rect class="entity security" x="1200" y="125" width="155" height="125" rx="5"/><text class="name" x="1277" y="154" text-anchor="middle">refresh_tokens</text><text class="field" x="1218" y="179">token_hash</text><text class="field" x="1218" y="201">rotation chain</text><text class="field" x="1218" y="223">expiry, revoke</text></g>
  <g><rect class="entity security" x="1390" y="125" width="140" height="125" rx="5"/><text class="name" x="1460" y="154" text-anchor="middle">audit_log</text><text class="field" x="1405" y="179">actor snapshot</text><text class="field" x="1405" y="201">resource UIDs</text><text class="field" x="1405" y="223">JSON detail</text></g>
  <g><rect class="entity ops" x="1010" y="315" width="220" height="160" rx="5"/><text class="name" x="1120" y="344" text-anchor="middle">background_jobs</text><text class="field" x="1030" y="369">kind, status, progress</text><text class="field" x="1030" y="391">idempotency_key</text><text class="field" x="1030" y="413">lease_owner / expiry</text><text class="field" x="1030" y="435">attempts / available_at</text><text class="field" x="1030" y="457">payload / result</text></g>
  <g><rect class="entity ops" x="1275" y="315" width="255" height="160" rx="5"/><text class="name" x="1402" y="344" text-anchor="middle">background_job_items</text><text class="field" x="1295" y="369">FK job · item_key</text><text class="field" x="1295" y="391">pending/running/terminal</text><text class="field" x="1295" y="413">attempts, input, result</text><text class="field" x="1295" y="435">per-file / per-instance state</text></g>
  <path class="line" d="M1165 188 H1200"/><path class="line dashed" d="M1165 210 Q1300 275 1390 210"/><path class="line" d="M1230 395 H1275"/>

  <rect class="group" x="35" y="555" width="750" height="450" rx="8"/><text class="group-title" x="55" y="585">协作阅片与分割</text>
  <g><rect class="entity collab" x="70" y="620" width="225" height="145" rx="5"/><text class="name" x="182" y="649" text-anchor="middle">viewer_annotations</text><text class="field" x="90" y="674">FK series · institution</text><text class="field" x="90" y="696">image/patient coordinate</text><text class="field" x="90" y="718">geometry JSONB · revision</text><text class="field" x="90" y="740">soft delete · schema version</text></g>
  <g><rect class="entity collab" x="360" y="620" width="220" height="145" rx="5"/><text class="name" x="470" y="649" text-anchor="middle">segmentation_projects</text><text class="field" x="380" y="674">FK series · institution</text><text class="field" x="380" y="696">status · revision</text><text class="field" x="380" y="718">creator / modifier</text></g>
  <g><rect class="entity collab" x="360" y="820" width="220" height="145" rx="5"/><text class="name" x="470" y="849" text-anchor="middle">segmentation_segments</text><text class="field" x="380" y="874">segment_number · label</text><text class="field" x="380" y="896">RGB color · algorithm</text><text class="field" x="380" y="918">tags[] (GIN)</text></g>
  <g><rect class="entity collab" x="620" y="820" width="130" height="145" rx="5"/><text class="name" x="685" y="849" text-anchor="middle">masks</text><text class="field" x="635" y="874">SOP/frame</text><text class="field" x="635" y="896">rows/cols</text><text class="field" x="635" y="918">RLE bytes</text><text class="field" x="635" y="940">revision</text></g>
  <path class="line" d="M470 765 V820"/><path class="line" d="M580 892 H620"/><path class="line dashed" d="M295 690 H360"/>

  <rect class="group" x="815" y="555" width="750" height="450" rx="8"/><text class="group-title" x="835" y="585">路由、生命周期与传输制品</text>
  <g><rect class="entity govern" x="850" y="620" width="190" height="130" rx="5"/><text class="name" x="945" y="649" text-anchor="middle">route_destinations</text><text class="field" x="870" y="674">DIMSE / STOW</text><text class="field" x="870" y="696">approval, health</text><text class="field" x="870" y="718">endpoint credentials</text></g>
  <g><rect class="entity govern" x="1080" y="620" width="190" height="130" rx="5"/><text class="name" x="1175" y="649" text-anchor="middle">route_rules</text><text class="field" x="1100" y="674">priority · filters</text><text class="field" x="1100" y="696">tag_matches JSONB</text><text class="field" x="1100" y="718">destination FK</text></g>
  <g><rect class="entity govern" x="1310" y="620" width="220" height="130" rx="5"/><text class="name" x="1420" y="649" text-anchor="middle">route_deliveries</text><text class="field" x="1330" y="674">destination + version unique</text><text class="field" x="1330" y="696">status · attempts · error</text><text class="field" x="1330" y="718">current job FK</text></g>
  <g><rect class="entity govern" x="850" y="815" width="190" height="145" rx="5"/><text class="name" x="945" y="844" text-anchor="middle">lifecycle_policies</text><text class="field" x="870" y="869">tier target · conditions</text><text class="field" x="870" y="891">preview signature</text><text class="field" x="870" y="913">schedule state</text></g>
  <g><rect class="entity govern" x="1080" y="815" width="190" height="145" rx="5"/><text class="name" x="1175" y="844" text-anchor="middle">legal_holds</text><text class="field" x="1100" y="869">Study scope</text><text class="field" x="1100" y="891">reason · expiry</text><text class="field" x="1100" y="913">release audit</text></g>
  <g><rect class="entity govern" x="1310" y="815" width="220" height="145" rx="5"/><text class="name" x="1420" y="844" text-anchor="middle">purge_requests / files</text><text class="field" x="1330" y="869">approval + grace period</text><text class="field" x="1330" y="891">paused_hold state</text><text class="field" x="1330" y="913">immutable deletion manifest</text></g>
  <path class="line" d="M1040 685 H1080"/><path class="line" d="M1270 685 H1310"/><path class="line dashed" d="M945 750 V815"/><path class="line dashed" d="M1175 750 V815"/><path class="line dashed" d="M1420 750 V815"/>
</svg>
