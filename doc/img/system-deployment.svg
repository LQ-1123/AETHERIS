<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Remote PACS 总体部署架构</title>
  <desc id="desc">影像设备、桌面查看器和外部平台经 DIMSE 或 HTTPS 访问 pacsd，pacsd 连接 PostgreSQL 与分层文件存储。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17212b" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#53616f"/>
    </marker>
    <style>
      .bg { fill: #f5f7f9; }
      .zone { fill: #ffffff; stroke: #b9c3cc; stroke-width: 1.5; }
      .server-zone { fill: #f0f5f3; stroke: #86a398; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #71808d; stroke-width: 1.5; filter: url(#shadow); }
      .device { fill: #eaf3fb; stroke: #5081a7; }
      .client { fill: #fff4e5; stroke: #b98136; }
      .service { fill: #e9f5ef; stroke: #438266; }
      .data { fill: #f4ecf7; stroke: #8a6395; }
      .title { font: 700 30px system-ui, "PingFang SC", sans-serif; fill: #1f2b34; }
      .zone-title { font: 700 19px system-ui, "PingFang SC", sans-serif; fill: #34424d; }
      .label { font: 700 18px system-ui, "PingFang SC", sans-serif; fill: #24313a; }
      .small { font: 14px system-ui, "PingFang SC", sans-serif; fill: #4f5d68; }
      .note { font: 13px system-ui, "PingFang SC", sans-serif; fill: #5e6972; }
      .line { fill: none; stroke: #53616f; stroke-width: 2; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="860"/>
  <text class="title" x="720" y="52" text-anchor="middle">Remote PACS 总体部署架构</text>

  <rect class="zone" x="45" y="90" width="305" height="700" rx="8"/>
  <text class="zone-title" x="197" y="125" text-anchor="middle">访问端与数据源</text>

  <rect class="box device" x="85" y="160" width="225" height="105" rx="7"/>
  <text class="label" x="197" y="198" text-anchor="middle">影像设备 / DCMTK</text>
  <text class="small" x="197" y="226" text-anchor="middle">CT、MR、CR、DX、US、PET</text>
  <text class="small" x="197" y="249" text-anchor="middle">C-ECHO / C-STORE / C-FIND</text>

  <rect class="box client" x="85" y="345" width="225" height="125" rx="7"/>
  <text class="label" x="197" y="383" text-anchor="middle">Tauri 桌面 Viewer</text>
  <text class="small" x="197" y="411" text-anchor="middle">工作列表、阅片、MPR</text>
  <text class="small" x="197" y="434" text-anchor="middle">标注、Mask、管理工具</text>
  <text class="small" x="197" y="457" text-anchor="middle">HTTPS + JWT</text>

  <rect class="box client" x="85" y="550" width="225" height="110" rx="7"/>
  <text class="label" x="197" y="588" text-anchor="middle">外部平台 / 工作站</text>
  <text class="small" x="197" y="616" text-anchor="middle">STOW-RS、Router API</text>
  <text class="small" x="197" y="639" text-anchor="middle">API Key + Scope</text>

  <rect class="server-zone" x="430" y="90" width="570" height="700" rx="10"/>
  <text class="zone-title" x="715" y="125" text-anchor="middle">应用服务节点</text>

  <rect class="box service" x="485" y="155" width="460" height="95" rx="7"/>
  <text class="label" x="715" y="192" text-anchor="middle">pacsd 统一进程</text>
  <text class="small" x="715" y="220" text-anchor="middle">Tokio 异步运行时 · 配置加载 · 自动迁移 · TLS 启动</text>

  <rect class="box service" x="485" y="300" width="205" height="125" rx="7"/>
  <text class="label" x="587" y="338" text-anchor="middle">DIMSE 服务</text>
  <text class="small" x="587" y="366" text-anchor="middle">Association / PDU</text>
  <text class="small" x="587" y="389" text-anchor="middle">Store / Find Handler</text>
  <text class="small" x="587" y="412" text-anchor="middle">Router DIMSE SCU</text>

  <rect class="box service" x="740" y="300" width="205" height="125" rx="7"/>
  <text class="label" x="842" y="338" text-anchor="middle">HTTPS API</text>
  <text class="small" x="842" y="366" text-anchor="middle">DICOMweb / Worklist</text>
  <text class="small" x="842" y="389" text-anchor="middle">Auth / Admin / Audit</text>
  <text class="small" x="842" y="412" text-anchor="middle">Axum + Rustls</text>

  <rect class="box service" x="485" y="495" width="460" height="155" rx="7"/>
  <text class="label" x="715" y="532" text-anchor="middle">领域服务与后台 Worker</text>
  <text class="small" x="715" y="562" text-anchor="middle">入库与查询 · 版本化修订 · 标注与分割</text>
  <text class="small" x="715" y="589" text-anchor="middle">导入/导出 · 路由投递 · 生命周期迁移/清除</text>
  <text class="small" x="715" y="616" text-anchor="middle">PostgreSQL 租约、重试、取消、幂等键</text>

  <rect class="zone" x="1080" y="90" width="315" height="700" rx="8"/>
  <text class="zone-title" x="1237" y="125" text-anchor="middle">持久化与治理</text>

  <rect class="box data" x="1125" y="180" width="225" height="130" rx="7"/>
  <text class="label" x="1237" y="220" text-anchor="middle">PostgreSQL</text>
  <text class="small" x="1237" y="249" text-anchor="middle">临床索引、版本链</text>
  <text class="small" x="1237" y="272" text-anchor="middle">账号、任务、审计、治理</text>
  <text class="small" x="1237" y="295" text-anchor="middle">机构级数据隔离</text>

  <rect class="box data" x="1125" y="400" width="225" height="205" rx="7"/>
  <text class="label" x="1237" y="440" text-anchor="middle">不可变文件归档</text>
  <text class="small" x="1237" y="470" text-anchor="middle">Hot 热层</text>
  <text class="small" x="1237" y="497" text-anchor="middle">Cold 冷层</text>
  <text class="small" x="1237" y="524" text-anchor="middle">Quarantine 隔离区</text>
  <text class="small" x="1237" y="551" text-anchor="middle">Derived 派生版本</text>
  <text class="small" x="1237" y="578" text-anchor="middle">Export 临时制品</text>

  <path class="line" d="M310 210 H455 Q475 210 485 225"/>
  <text class="note" x="380" y="195" text-anchor="middle">DIMSE/TCP</text>
  <path class="line" d="M310 405 H700 Q720 405 740 382"/>
  <text class="note" x="480" y="390" text-anchor="middle">HTTPS</text>
  <path class="line" d="M310 605 H700 Q720 605 740 395"/>
  <text class="note" x="445" y="590" text-anchor="middle">HTTPS / STOW-RS</text>
  <path class="line" d="M945 360 H1040 Q1060 360 1125 255"/>
  <text class="note" x="1030" y="335" text-anchor="middle">SQLx</text>
  <path class="line" d="M945 570 H1040 Q1060 570 1125 520"/>
  <text class="note" x="1035" y="555" text-anchor="middle">受控相对路径</text>
  <path class="line dash" d="M1125 295 Q1040 320 945 540"/>
  <text class="note" x="1035" y="435" text-anchor="middle">事务状态</text>

  <text class="note" x="720" y="825" text-anchor="middle">安全边界：客户端不持有数据库凭据；HTTP 以 TLS、身份、权限和 Institution 条件共同约束访问</text>
</svg>
