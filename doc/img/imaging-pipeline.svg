<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="940" viewBox="0 0 1540 940" role="img" aria-labelledby="title desc">
  <title id="title">Viewer 影像处理与量化算法管线</title>
  <desc id="desc">从 DICOM 解码、几何校验到二维显示、MPR、MIP、测量、PET SUV 和 Mask 的算法流程。</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#5a6872"/></marker>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f6f8fa}.box{stroke-width:1.5;filter:url(#s)}.input{fill:#e8f2fa;stroke:#5080a0}.calc{fill:#eaf5ee;stroke:#4c8168}.view{fill:#fff1df;stroke:#b77b2f}.measure{fill:#f2eaf5;stroke:#866290}.mask{fill:#edf4e6;stroke:#6a894b}.title{font:700 30px system-ui,"PingFang SC",sans-serif;fill:#202b33}.label{font:700 17px system-ui,"PingFang SC",sans-serif;fill:#26323b}.small{font:13px system-ui,"PingFang SC",sans-serif;fill:#53616b}.line{fill:none;stroke:#5a6872;stroke-width:1.8;marker-end:url(#a)}.dash{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect class="bg" width="1540" height="940"/><text class="title" x="770" y="50" text-anchor="middle">Viewer 影像处理与量化算法管线</text>

  <rect class="box input" x="60" y="105" width="240" height="105" rx="7"/><text class="label" x="180" y="140" text-anchor="middle">DICOM 输入</text><text class="small" x="180" y="168" text-anchor="middle">本地文件或 WADO-RS</text><text class="small" x="180" y="190" text-anchor="middle">8/16 bit 灰度 · RGB/YBR/Palette</text>
  <rect class="box calc" x="385" y="105" width="260" height="105" rx="7"/><text class="label" x="515" y="140" text-anchor="middle">统一帧解码</text><text class="small" x="515" y="168" text-anchor="middle">压缩语法解码 · RGB8 标准化</text><text class="small" x="515" y="190" text-anchor="middle">帧预取与有界 LRU</text>
  <rect class="box calc" x="730" y="105" width="300" height="105" rx="7"/><text class="label" x="880" y="140" text-anchor="middle">图像组识别与几何验证</text><text class="small" x="880" y="168" text-anchor="middle">方向/尺寸聚类 · n = r × c</text><text class="small" x="880" y="190" text-anchor="middle">按 p · n 排序 · 中位间距校验</text>
  <rect class="box calc" x="1115" y="105" width="350" height="105" rx="7"/><text class="label" x="1290" y="140" text-anchor="middle">患者空间规则体数据</text><text class="small" x="1290" y="168" text-anchor="middle">Stored Value f32 Volume · GPU R16 Texture</text><text class="small" x="1290" y="190" text-anchor="middle">行/列/法向轴 + 物理间距 + 边界</text>
  <path class="line" d="M300 157 H385"/><path class="line" d="M645 157 H730"/><path class="line" d="M1030 157 H1115"/>

  <rect class="box view" x="85" y="315" width="330" height="170" rx="7"/><text class="label" x="250" y="350" text-anchor="middle">二维灰度 / 彩色显示</text><text class="small" x="250" y="380" text-anchor="middle">m = SV × slope + intercept</text><text class="small" x="250" y="405" text-anchor="middle">VOI：LINEAR / EXACT / SIGMOID</text><text class="small" x="250" y="430" text-anchor="middle">MONOCHROME1 最终反转</text><text class="small" x="250" y="455" text-anchor="middle">Canvas 变换：缩放、平移、翻转、旋转</text>
  <rect class="box view" x="500" y="315" width="330" height="170" rx="7"/><text class="label" x="665" y="350" text-anchor="middle">MPR / Slab / GPU VR</text><text class="small" x="665" y="380" text-anchor="middle">患者坐标 → 源体素坐标</text><text class="small" x="665" y="405" text-anchor="middle">三线性插值 · WebGL2 光线步进</text><text class="small" x="665" y="430" text-anchor="middle">三平面联动 · 3D 视角控制</text><text class="small" x="665" y="455" text-anchor="middle">Slice / MIP / MinIP / 体渲染</text>
  <rect class="box measure" x="915" y="315" width="250" height="170" rx="7"/><text class="label" x="1040" y="350" text-anchor="middle">定量测量</text><text class="small" x="1040" y="380" text-anchor="middle">长度与角度</text><text class="small" x="1040" y="405" text-anchor="middle">点值、均值、SD、极值</text><text class="small" x="1040" y="430" text-anchor="middle">ROI 面积</text><text class="small" x="1040" y="455" text-anchor="middle">CT HU / PET SUVbw</text>
  <rect class="box mask" x="1250" y="315" width="230" height="170" rx="7"/><text class="label" x="1365" y="350" text-anchor="middle">Mask 分割</text><text class="small" x="1365" y="380" text-anchor="middle">三维物理球形画刷</text><text class="small" x="1365" y="405" text-anchor="middle">稀疏切片体</text><text class="small" x="1365" y="430" text-anchor="middle">RLE-v1 压缩</text><text class="small" x="1365" y="455" text-anchor="middle">体积与最大径统计</text>
  <path class="line" d="M515 210 Q450 265 250 315"/><path class="line" d="M1290 210 Q980 260 665 315"/><path class="line" d="M1290 210 Q1160 260 1040 315"/><path class="line" d="M1290 210 Q1370 260 1365 315"/>

  <rect class="box calc" x="90" y="600" width="300" height="175" rx="7"/><text class="label" x="240" y="635" text-anchor="middle">显示性能控制</text><text class="small" x="240" y="665" text-anchor="middle">预计算灰度 LUT（最多 16 bit）</text><text class="small" x="240" y="690" text-anchor="middle">前端约 128 MiB 帧缓存</text><text class="small" x="240" y="715" text-anchor="middle">后端约 512 MiB 解码缓存</text><text class="small" x="240" y="740" text-anchor="middle">请求版本丢弃过期结果</text>
  <rect class="box calc" x="470" y="600" width="300" height="175" rx="7"/><text class="label" x="620" y="635" text-anchor="middle">MPR 安全门槛</text><text class="small" x="620" y="665" text-anchor="middle">方向容差 1e-4</text><text class="small" x="620" y="690" text-anchor="middle">间距容差 max(0.1 mm, 5%)</text><text class="small" x="620" y="715" text-anchor="middle">体数据上限 768 MiB</text><text class="small" x="620" y="740" text-anchor="middle">异常几何直接拒绝构建</text>
  <rect class="box measure" x="850" y="600" width="300" height="175" rx="7"/><text class="label" x="1000" y="635" text-anchor="middle">量化可信度</text><text class="small" x="1000" y="665" text-anchor="middle">PixelSpacing：已标定 mm</text><text class="small" x="1000" y="690" text-anchor="middle">ImagerPixelSpacing：探测器平面 mm</text><text class="small" x="1000" y="715" text-anchor="middle">无可靠间距：像素单位</text><text class="small" x="1000" y="740" text-anchor="middle">缺关键 PET Tag：明确禁用 SUV</text>
  <rect class="box mask" x="1230" y="600" width="250" height="175" rx="7"/><text class="label" x="1355" y="635" text-anchor="middle">协同一致性</text><text class="small" x="1355" y="665" text-anchor="middle">Annotation Revision</text><text class="small" x="1355" y="690" text-anchor="middle">Mask 逐层 Revision</text><text class="small" x="1355" y="715" text-anchor="middle">409 冲突，不静默覆盖</text><text class="small" x="1355" y="740" text-anchor="middle">Undo/Redo 后异步同步</text>
  <path class="line dash" d="M250 485 V600"/><path class="line dash" d="M665 485 Q650 545 620 600"/><path class="line dash" d="M1040 485 Q1030 545 1000 600"/><path class="line dash" d="M1365 485 V600"/>
  <text class="small" x="770" y="865" text-anchor="middle">设计原则：显示计算与原始像素分离，所有量化基于 Stored Value 或物理空间，而不是窗宽窗位后的屏幕灰度</text>
</svg>
